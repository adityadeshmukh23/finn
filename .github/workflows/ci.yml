# Tests the backend and builds the PWA on every push. Deploys happen in Vercel (static demo).
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }   # 3.12, same as local dev
      - uses: actions/setup-node@v4
        with: { node-version: "24" }   # same as local dev
      - name: Backend tests
        run: |
          python -m pip install -q -r backend/requirements.txt
          cd backend && python -m pytest -q
      - name: Demo data is up to date with the snapshot and ranking code
        run: |
          cd backend && python -m scripts.build_static
          git diff --exit-code -- ../web/public/demo || { echo "Run: cd backend && python -m scripts.build_static"; exit 1; }
      - name: Guard - nothing secret or licensed is tracked
        run: |
          if git ls-files | grep -E '\.pdf$|(^|/)\.env$|\.sqlite$'; then echo "Refusing: tracked PDF, .env or sqlite"; exit 1; fi
      - name: Web build, and no stale-app-shell risk (no caching service worker; kill switch works)
        run: cd web && npm ci && npm run build && npm run check:sw
      - name: Web tests and bundle-size ceiling
        run: cd web && npm test && npm run check:size
