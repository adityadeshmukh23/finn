# Mirrors the backend (code + snapshots + recordings, nothing else) to a Hugging Face Docker Space.
# Needs repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "your-name/finn-api").
name: Deploy API to Hugging Face

on:
  push:
    branches: [main]
    paths: ["backend/**", "data/**", "deploy/space/**", ".github/workflows/deploy-space.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        run: |
          python -m pip install -q -r backend/requirements.txt
          cd backend && python -m pytest -q

      - name: Assemble Space
        run: |
          mkdir space
          cp deploy/space/Dockerfile deploy/space/README.md space/
          cp -r backend data space/
          rm -rf space/data/cache space/backend/tests
          # Guard: nothing secret or licensed ships.
          if find space -name '*.pdf' -o -name '.env' -o -name '*.sqlite' | grep -q .; then
            echo "Refusing to deploy: PDF, .env or sqlite file in bundle"; exit 1
          fi

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
