<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <!-- Dark unless the reader chose light, applied before first paint. src/theme.ts holds the same key and colour. -->
    <script>
      try {
        if (localStorage.getItem('finn.theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f6f5f2'
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Your portfolio's filings, ranked: what matters first, routine paperwork collapsed, and every figure tied to its page. A recorded demo." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FINN" />
    <meta property="og:title" content="FINN: your portfolio's filings, ranked" />
    <meta property="og:description" content="What matters first, routine paperwork collapsed, and every figure tied to its page. A recorded demo." />
    <meta property="og:url" content="https://finn-olive.vercel.app/" />
    <meta property="og:image" content="https://finn-olive.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FINN: your portfolio's filings, ranked. A stepped line on paper." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FINN: your portfolio's filings, ranked" />
    <meta name="twitter:description" content="What matters first, routine paperwork collapsed, and every figure tied to its page. A recorded demo." />
    <meta name="twitter:image" content="https://finn-olive.vercel.app/og.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>FINN: your portfolio's filings, ranked</title>
    <!-- Clears the caching service worker earlier builds registered; see public/sw.js. -->
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()))
      if ('caches' in window) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
